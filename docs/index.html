<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FallEstate SDK · Playground</title>
<style>
  :root { --bg:#0f0f13; --fg:#e8e6e0; --dim:#8f8b82; --acc:#7a9c7e; --card:#1a1a1f; --line:#2a2a30; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:2rem;max-width:1100px;margin-inline:auto}
  h1{font-weight:700;font-size:2rem;margin:0 0 .25rem}
  .kicker{color:var(--dim);font-size:.9rem;margin-bottom:1.5rem}
  .kicker a{color:var(--acc)}
  .controls{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1.5rem;align-items:center}
  input,select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:.55rem .75rem;font:inherit}
  input{flex:1;min-width:220px}
  .stat{color:var(--dim);font-size:.85rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem;transition:border-color .15s}
  .card:hover{border-color:var(--acc)}
  .card h3{margin:0 0 .35rem;font-size:1.05rem}
  .layer{color:var(--acc);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.5rem}
  .tag{color:var(--dim);font-size:.9rem;margin-bottom:.75rem;font-style:italic}
  .row{font-size:.85rem;margin:.25rem 0}
  .k{color:var(--acc);font-weight:600;margin-right:.35rem}
  .card a{color:var(--acc);font-size:.8rem}
  .empty{color:var(--dim);padding:2rem;text-align:center}
</style>
</head>
<body>
<h1>FallEstate SDK · Playground</h1>
<div class="kicker">88 sovereign tools across 9 layers · <a href="https://github.com/sjgant80-hub/fallestate-sdk">GitHub</a> · <a href="https://www.npmjs.com/package/@ai-native-solutions/fallestate-sdk">npm</a></div>

<div class="controls">
  <input id="q" type="search" placeholder="Search name, tag, description...">
  <select id="layer">
    <option value="">All layers</option>
  </select>
  <span class="stat" id="stat">Loading…</span>
</div>

<div id="grid" class="grid"></div>

<script type="module">
const LAYERS = { 0:'Substrate',1:'Insight',2:'Signal',3:'Island Stack',4:'Mobile / Mesh',5:'AI Substrate',6:'SMB Verticals',7:'SDK / MCP',8:'Specialised' };
const layerSel = document.getElementById('layer');
for (const [n, name] of Object.entries(LAYERS)) {
  const o = document.createElement('option'); o.value = n; o.textContent = `${n}. ${name}`; layerSel.appendChild(o);
}

let TOOLS = [];
try {
  TOOLS = await (await fetch('../src/tools.json')).json();
} catch {
  TOOLS = await (await fetch('./tools.json')).json();
}

const q = document.getElementById('q');
const grid = document.getElementById('grid');
const stat = document.getElementById('stat');

function render() {
  const query = q.value.trim().toLowerCase();
  const lyr = layerSel.value;
  let out = TOOLS;
  if (lyr !== '') out = out.filter(t => String(t.layer) === lyr);
  if (query) {
    out = out.filter(t => (t.name + ' ' + t.tag + ' ' + t.does + ' ' + t.kills + ' ' + t.saves + ' ' + t.helps).toLowerCase().includes(query));
  }
  stat.textContent = `${out.length} of ${TOOLS.length}`;
  grid.innerHTML = out.length ? out.map(t => `
    <div class="card">
      <div class="layer">Layer ${t.layer} · ${LAYERS[t.layer]}</div>
      <h3>${escape(t.name)}</h3>
      <div class="tag">${escape(t.tag || '')}</div>
      ${t.does  ? `<div class="row"><span class="k">Does</span>${escape(t.does)}</div>` : ''}
      ${t.kills ? `<div class="row"><span class="k">Kills</span>${escape(t.kills)}</div>` : ''}
      ${t.saves ? `<div class="row"><span class="k">Saves</span>${escape(t.saves)}</div>` : ''}
      ${t.helps ? `<div class="row"><span class="k">Helps</span>${escape(t.helps)}</div>` : ''}
      ${t.github ? `<div style="margin-top:.6rem"><a href="${t.github}" target="_blank" rel="noopener">Repository →</a></div>` : ''}
    </div>
  `).join('') : `<div class="empty">No matches.</div>`;
}
function escape(s){return String(s).replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
q.addEventListener('input', render);
layerSel.addEventListener('change', render);
render();
</script>
</body>
</html>
